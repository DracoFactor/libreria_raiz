<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario - Librería Raíz</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
</head>
<body>
<header>
    <h1>Librería Raíz</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/nosotros}">Nosotros</a>
        <a th:href="@{/blog}">Blog</a>
        <a th:href="@{/calendario}">Calendario</a>
        <a th:href="@{/contacto}">Contacto</a>
    </nav>
</header>
<main class="cal-container">
    <div class="cal-header">
        <h2>Calendario de Eventos</h2>
        <a th:href="@{/calendario/nuevo}" class="cal-btn">+ Nuevo evento</a>
    </div>

    <p th:if="${#lists.isEmpty(eventos)}" class="cal-empty">No hay eventos programados.</p>

    <div class="cal-grid" th:unless="${#lists.isEmpty(eventos)}">
        <article class="cal-card" th:each="evento : ${eventos}">
            <div class="cal-card__fecha"
                 th:text="${evento.fecha != null ? #temporals.format(evento.fecha, 'dd MMM') : '—'}">—</div>
            <div class="cal-card__body">
                <h3 class="cal-card__nombre" th:text="${evento.nombre}">Nombre</h3>
                <p class="cal-card__lugar" th:text="${evento.lugar}">Lugar</p>
                <p class="cal-card__desc" th:text="${evento.descripcion}">Descripción</p>
            </div>
        </article>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
