<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Reseña - Librería Raíz</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">
</head>
<body>
<header>
    <h1>Librería Raíz</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/nosotros}">Nosotros</a>
        <a th:href="@{/blog}">Blog</a>
        <a th:href="@{/calendario}">Calendario</a>
        <a th:href="@{/contacto}">Contacto</a>
    </nav>
</header>
<main class="blog-container">
    <div class="blog-header">
        <h2>Nueva Reseña</h2>
        <a th:href="@{/blog}" class="blog-btn blog-btn--secundario">← Volver</a>
    </div>
    <form class="blog-form" th:action="@{/blog}" th:object="${post}" method="post">
        <div class="form-group">
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" th:field="*{titulo}" required>
        </div>
        <div class="form-group">
            <label for="autor">Autor:</label>
            <input type="text" id="autor" th:field="*{autor}">
        </div>
        <div class="form-group">
            <label for="contenido">Reseña:</label>
            <textarea id="contenido" rows="8" th:field="*{contenido}" required></textarea>
        </div>
        <div class="blog-form__acciones">
            <a th:href="@{/blog}" class="blog-btn blog-btn--secundario">Cancelar</a>
            <button type="submit" class="blog-btn">Publicar</button>
        </div>
    </form>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
