<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Librería Raíz</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
</head>
<body>
<header>
    <h1>Librería Raíz</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/nosotros}">Nosotros</a>
        <a th:href="@{/blog}">Blog</a>
        <a th:href="@{/calendario}">Calendario</a>
        <a th:href="@{/contacto}">Contacto</a>
    </nav>
</header>
<main class="contacto-container">
    <h2>Contacto</h2>
    <p>¿Tienes alguna pregunta o sugerencia? ¡Escríbenos!</p>

    <div th:if="${exito}" class="mensaje-exito" th:text="${exito}"></div>

    <form id="formulario-contacto" class="contact-form"
          th:action="@{/contacto}" th:object="${mensajeContacto}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>
            <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" th:field="*{email}" required>
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" rows="5" th:field="*{mensaje}" required></textarea>
            <span class="error" th:if="${#fields.hasErrors('mensaje')}" th:errors="*{mensaje}"></span>
        </div>
        <button type="submit" class="btn-enviar">Enviar Mensaje</button>
    </form>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/contacto.js}"></script>
</body>
</html>
