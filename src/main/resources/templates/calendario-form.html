<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Evento - Librería Raíz</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/calendario.css}">
</head>
<body>
<header>
    <h1>Librería Raíz</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/nosotros}">Nosotros</a>
        <a th:href="@{/blog}">Blog</a>
        <a th:href="@{/calendario}">Calendario</a>
        <a th:href="@{/contacto}">Contacto</a>
    </nav>
</header>
<main class="cal-container">
    <div class="cal-header">
        <h2>Nuevo Evento</h2>
        <a th:href="@{/calendario}" class="cal-btn cal-btn--secundario">← Volver</a>
    </div>
    <form class="cal-form" th:action="@{/calendario}" th:object="${evento}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required>
        </div>
        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" th:field="*{fecha}">
        </div>
        <div class="form-group">
            <label for="lugar">Lugar:</label>
            <input type="text" id="lugar" th:field="*{lugar}">
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" rows="4" th:field="*{descripcion}"></textarea>
        </div>
        <div class="cal-form__acciones">
            <a th:href="@{/calendario}" class="cal-btn cal-btn--secundario">Cancelar</a>
            <button type="submit" class="cal-btn">Guardar</button>
        </div>
    </form>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
